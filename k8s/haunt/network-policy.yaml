apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haunt
  namespace: haunt
spec:
  podSelector:
    matchLabels:
      app: haunt
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
  egress: []

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - namespace.yaml
  - workload.yaml # Web image from 3d3864e with a PNG favicon fallback.
patches:
  - target:
      kind: Deployment
      name: atbbs-web
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/matchLabelKeys
        value:
          - pod-template-hash

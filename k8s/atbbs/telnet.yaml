apiVersion: apps/v1
kind: Deployment
metadata:
  name: atbbs-telnet
  namespace: atbbs
  labels:
    app: atbbs-telnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atbbs-telnet
  template:
    metadata:
      labels:
        app: atbbs-telnet
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atbbs-telnet
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/alyraffauf/atbbs-telnet:latest@sha256:3361f6155317eec01da08069f7b2dd6b614dfba37e6c67b3ccc14036ac9c4bb4
          ports:
            - name: telnet
              containerPort: 2323
          readinessProbe:
            tcpSocket:
              port: telnet
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atbbs-telnet
  namespace: atbbs
spec:
  selector:
    app: atbbs-telnet
  ports:
    - name: telnet
      port: 2323
      targetPort: telnet
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: atbbs-telnet
  namespace: atbbs
spec:
  entryPoints:
    - telnet
  routes:
    - match: HostSNI(`*`)
      services:
        - name: atbbs-telnet
          port: 2323

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aly-town
  namespace: aly-town
spec:
  secretName: aly-town-tls
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
  dnsNames: [aly.town, www.aly.town]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aly-town-canonical-host
  namespace: aly-town
spec:
  redirectRegex:
    regex: "^https?://www[.]aly[.]town(/.*)$"
    replacement: "https://aly.town${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aly-town
  namespace: aly-town
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: aly-town-aly-town-canonical-host@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [aly.town, www.aly.town], secretName: aly-town-tls }]
  rules:
    - host: aly.town
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aly-town
                port:
                  name: http
    - host: www.aly.town
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aly-town
                port:
                  name: http

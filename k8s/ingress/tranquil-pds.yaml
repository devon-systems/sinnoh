apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tranquil-pds
  namespace: tranquil-pds
spec:
  secretName: tranquil-pds-tls
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
  dnsNames: [aly.social, "*.aly.social"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: tranquil-pds, namespace: tranquil-pds }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [aly.social, "*.aly.social"], secretName: tranquil-pds-tls }]
  rules:
    - host: aly.social
      http:
        {
          paths:
            [
              {
                path: /xrpc,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /oauth,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /.well-known,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /u,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /health,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /favicon.ico,
                pathType: Exact,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: pacifico, port: { number: 80 } } },
              },
            ],
        }
    - host: "*.aly.social"
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend:
                  { service: { name: tranquil-pds, port: { number: 80 } } },
              },
            ],
        }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aly-social-canonical-host
  namespace: tranquil-pds
spec:
  redirectRegex:
    regex: "^https?://www[.]aly[.]social(/.*)$"
    replacement: "https://aly.social${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aly-social-www
  namespace: tranquil-pds
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: tranquil-pds-aly-social-canonical-host@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls: [{ hosts: [www.aly.social], secretName: tranquil-pds-tls }]
  rules:
    - host: www.aly.social
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pacifico
                port:
                  number: 80

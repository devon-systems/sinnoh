apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: snrld
  namespace: snrld
spec:
  secretName: snrld-tls
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
  dnsNames: [snarled.at, www.snarled.at]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: snrld-canonical-host
  namespace: snrld
spec:
  redirectRegex:
    regex: "^https?://www[.]snarled[.]at(/.*)$"
    replacement: "https://snarled.at${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snrld
  namespace: snrld
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: snrld-snrld-canonical-host@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [snarled.at, www.snarled.at], secretName: snrld-tls }]
  rules:
    - host: snarled.at
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: snrld, port: { name: http } } },
              },
            ],
        }
    - host: www.snarled.at
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: snrld, port: { name: http } } },
              },
            ],
        }

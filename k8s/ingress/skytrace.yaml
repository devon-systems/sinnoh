apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: skytrace
  namespace: skytrace
spec:
  secretName: skytrace-tls
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
  dnsNames: [skytrace.aly.town]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: skytrace-https
  namespace: skytrace
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skytrace
  namespace: skytrace
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: skytrace-skytrace-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [skytrace.aly.town], secretName: skytrace-tls }]
  rules:
    - host: skytrace.aly.town
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: skytrace, port: { name: http } } },
              },
            ],
        }

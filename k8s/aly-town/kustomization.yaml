apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aly-town
resources:
  - namespace.yaml
  - workload.yaml
  - network-policy.yaml
patches:
  - target:
      kind: Deployment
      name: aly-town
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/matchLabelKeys
        value:
          - pod-template-hash

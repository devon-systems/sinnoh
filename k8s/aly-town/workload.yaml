apiVersion: apps/v1
kind: Deployment
metadata:
  name: aly-town
  namespace: aly-town
  labels:
    app: aly-town
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aly-town
  template:
    metadata:
      labels:
        app: aly-town
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: aly-town
      containers:
        - name: aly-town
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/aly.town:latest@sha256:71ca84488fef11db924027384fc38f78bf68a509fd6bffcf459ed2bf9e3c1638
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: aly-town
  namespace: aly-town
spec:
  selector:
    app: aly-town
  ports:
    - name: http
      port: 80
      targetPort: http

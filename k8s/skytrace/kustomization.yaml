apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - workload.yaml # SkyTrace image pin and profile visibility policy.
patches:
  - target:
      kind: Deployment
      name: skytrace
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/matchLabelKeys
        value:
          - pod-template-hash

apiVersion: apps/v1
kind: Deployment
metadata:
  name: skytrace
  namespace: skytrace
  labels:
    app: skytrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skytrace
  template:
    metadata:
      labels:
        app: skytrace
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: skytrace
      containers:
        - name: skytrace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/skytrace:latest@sha256:f003899b4df204a7fd3e28b5d0881f8c8375eabe8006954e1642156375a7c724
          env:
            - name: SKYTRACE_DONATE_REMINDER_DAYS
              value: "14"
            - name: SKYTRACE_BLOCK_TARGET_DID
              value: "did:plc:jwxdvd2mdtdq7la7toiy2rjc"
            - name: SKYTRACE_HIDDEN_DIDS
              value: "did:plc:ksjfbda7262bbqmuoly54lww"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skytrace
  namespace: skytrace
spec:
  selector:
    app: skytrace
  ports:
    - name: http
      port: 80
      targetPort: http

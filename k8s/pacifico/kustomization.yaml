apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - workload.yaml
patches:
  - target:
      kind: Deployment
      name: pacifico
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/matchLabelKeys
        value:
          - pod-template-hash

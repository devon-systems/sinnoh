apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snrld
resources:
  - network-policy.yaml
  - namespace.yaml
  - workload.yaml # snarled.at public URL and OAuth client metadata.
patches:
  - target:
      kind: Deployment
      name: snrld
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/matchLabelKeys
        value:
          - pod-template-hash

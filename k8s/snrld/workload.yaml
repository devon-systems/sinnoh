apiVersion: apps/v1
kind: Deployment
metadata:
  name: snrld
  namespace: snrld
  labels:
    app: snrld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snrld
  template:
    metadata:
      labels:
        app: snrld
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: snrld
      containers:
        - name: snrld
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/snrld:latest@sha256:6ada188f1bf82fbc2c1dcea00f9d9824496e3314c5180b510bb81607435310e9
          env:
            - name: PUBLIC_URL
              value: https://snarled.at
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: snrld
  namespace: snrld
spec:
  selector:
    app: snrld
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hydrant
  namespace: hydrant
spec:
  podSelector:
    matchLabels:
      app: hydrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bobbin
          podSelector:
            matchLabels:
              app: bobbin
      ports:
        - protocol: TCP
          port: 3000

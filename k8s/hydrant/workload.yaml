apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hydrant-data
  namespace: hydrant
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrant
  namespace: hydrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hydrant
  template:
    metadata:
      labels:
        app: hydrant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: sunnyshore
      imagePullSecrets:
        - name: hydrant-atcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hydrant
          image: atcr.io/ptr.pet/hydrant:latest@sha256:10546b960bbb35999e52332b1bcd7b0a0cf0caed79ed818fc418e3e4507dbc3c
          env:
            - name: HYDRANT_DATABASE_PATH
              value: /data/hydrant.db
            - name: HYDRANT_API_BIND
              value: "0.0.0.0:3000"
            - name: HYDRANT_FULL_NETWORK
              value: "false"
            - name: HYDRANT_FILTER_COLLECTIONS
              value: "sh.tangled.*,org.tangled.*"
            - name: HYDRANT_FILTER_SIGNALS
              # Discovery requires exact collections; wildcards only match live events.
              value: "sh.tangled.actor.profile,sh.tangled.feed.comment,sh.tangled.feed.reaction,sh.tangled.feed.star,sh.tangled.feed.subscription,sh.tangled.git.refUpdate,sh.tangled.graph.follow,sh.tangled.graph.vouch,sh.tangled.knot,sh.tangled.knot.member,sh.tangled.knot.memberAcceptance,sh.tangled.knot.memberInvite,sh.tangled.label.definition,sh.tangled.label.op,sh.tangled.pipeline,sh.tangled.pipeline.status,sh.tangled.publicKey,sh.tangled.repo,sh.tangled.repo.artifact,sh.tangled.repo.collaborator,sh.tangled.repo.collaboratorAcceptance,sh.tangled.repo.collaboratorInvite,sh.tangled.repo.issue,sh.tangled.repo.issue.comment,sh.tangled.repo.issue.state,sh.tangled.repo.pull,sh.tangled.repo.pull.comment,sh.tangled.repo.pull.status,sh.tangled.spindle,sh.tangled.spindle.member,sh.tangled.string,org.tangled.feed.subscription"
            - name: HYDRANT_BACKFILL_CONCURRENCY_LIMIT
              value: "4"
            - name: HYDRANT_PER_PDS_CONCURRENCY
              value: "2"
            - name: HYDRANT_FIREHOSE_WORKERS
              value: "2"
            - name: HYDRANT_CACHE_SIZE
              value: "64"
            - name: HYDRANT_IDENTITY_CACHE_SIZE
              value: "10000"
            - name: HYDRANT_DB_MAX_JOURNALING_SIZE_MB
              value: "128"
            - name: RUST_LOG
              value: "warn,hydrant=info,fjall=warn,lsm_tree=warn"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hydrant-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hydrant
  namespace: hydrant
spec:
  selector:
    app: hydrant
  ports:
    - name: http
      port: 3000
      targetPort: http

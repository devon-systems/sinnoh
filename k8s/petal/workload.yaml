apiVersion: apps/v1
kind: Deployment
metadata:
  name: petal
  namespace: petal
  labels:
    app: petal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petal
  template:
    metadata:
      labels:
        app: petal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: petal
      containers:
        - name: petal
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/alyraffauf/petal-website:latest@sha256:bf8a014d98fda1e15a131340835b5701b379e5b22083dabb6bb55931d2b9dc6f
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: petal
  namespace: petal
spec:
  selector:
    app: petal
  ports:
    - name: http
      port: 80
      targetPort: http

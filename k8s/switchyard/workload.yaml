apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard
  namespace: switchyard
  labels:
    app: switchyard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: switchyard
  template:
    metadata:
      labels:
        app: switchyard
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: switchyard
      containers:
        - name: switchyard
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/switchyard-website:latest@sha256:737825f8ce1d134b5753dc72acfcba324de8f7458b91b51f544e867826649049
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: switchyard
  namespace: switchyard
spec:
  selector:
    app: switchyard
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared
  namespace: cnpg-system
spec:
  instances: 2
  postgresql:
    parameters:
      max_connections: "350"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-shared-backups
  managed:
    roles:
      - name: vaultwarden
        login: true
        passwordSecret:
          name: vaultwarden-pg-creds
      - name: tranquil
        login: true
        passwordSecret:
          name: tranquil-pg-creds

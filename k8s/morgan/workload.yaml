apiVersion: apps/v1
kind: Deployment
metadata:
  name: morgan
  namespace: morgan
  labels:
    app: morgan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: morgan
  template:
    metadata:
      labels:
        app: morgan
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: morgan
      containers:
        - name: morgan
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/morgantamayo.com:latest@sha256:6b77b9fab85f3fd30e7ef6a4b5fd369a540142573d02b45b81e00a775edb302a
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: morgan
  namespace: morgan
spec:
  selector:
    app: morgan
  ports:
    - name: http
      port: 80
      targetPort: http

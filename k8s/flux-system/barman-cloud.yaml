apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: cnpg
  interval: 10m
  retryInterval: 1m
  path: ./k8s/barman-cloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true

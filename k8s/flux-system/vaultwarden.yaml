apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  dependsOn:
    - name: postgres
    - name: secrets
  interval: 10m
  path: ./k8s/vaultwarden
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true

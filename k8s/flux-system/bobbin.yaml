apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bobbin
  namespace: flux-system
spec:
  dependsOn:
    - name: slingshot
    - name: hydrant
  interval: 10m
  path: ./k8s/bobbin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tranquil-pds
  namespace: tranquil-pds
  labels:
    app: tranquil-pds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tranquil-pds
  template:
    metadata:
      labels:
        app: tranquil-pds
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tranquil-pds-atcr-pull
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tranquil-pds
              matchLabelKeys:
                - pod-template-hash
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tranquil-pds
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: atcr.io/tranquil.farm/tranquil-pds:latest@sha256:cf85f4c9e3395a9cfab3db8214e66de0168f508fd09f3b1d82788caf8c70f67a
          env:
            - name: AWS_REGION
              value: us-east-005
            - name: BLOB_STORAGE_BACKEND
              value: s3
            - name: CACHE_BACKEND
              value: valkey
            - name: CRAWLERS
              value: https://bsky.network
            - name: INVITE_CODE_REQUIRED
              value: "true"
            - name: MAIL_FROM_ADDRESS
              value: admin@aly.social
            - name: MAIL_FROM_NAME
              value: tranquil
            - name: MAIL_SMARTHOST_HOST
              value: smtp.resend.com
            - name: MAIL_SMARTHOST_PORT
              value: "2465"
            - name: MAIL_SMARTHOST_TLS
              value: implicit
            - name: MAIL_SMARTHOST_USERNAME
              value: resend
            - name: MAX_CONCURRENT_REPO_EXPORTS
              value: "2"
            - name: PDS_HOSTNAME
              value: aly.social
            - name: PDS_USER_HANDLE_DOMAINS
              value: aly.social
            - name: PLC_DIRECTORY_URL
              value: https://plc.directory
            - name: S3_BUCKET
              value: aly-tranquil-blobs
            - name: S3_ENDPOINT
              value: https://s3.us-east-005.backblazeb2.com
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "3000"
            - name: SKIP_IMPORT_VERIFICATION
              value: "false"
            - name: SSO_OIDC_DISPLAY_NAME
              value: cute.haus
            - name: SSO_OIDC_ENABLED
              value: "true"
            - name: SSO_OIDC_ISSUER
              value: https://id.cute.haus
            - name: VALKEY_URL
              value: redis://tranquil-pds-valkey:6379/5
          envFrom:
            - secretRef:
                name: tranquil-pds-env
            - secretRef:
                name: tranquil-pds-sso-env
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tranquil-pds
  namespace: tranquil-pds
  labels:
    app: tranquil-pds
spec:
  selector:
    app: tranquil-pds
  ports:
    - name: http
      port: 80
      targetPort: http

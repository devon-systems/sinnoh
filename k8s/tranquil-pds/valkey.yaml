apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tranquil-pds-valkey-data
  namespace: tranquil-pds
  labels:
    app: tranquil-pds-valkey
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tranquil-pds-valkey
  namespace: tranquil-pds
  labels:
    app: tranquil-pds-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tranquil-pds-valkey
  template:
    metadata:
      labels:
        app: tranquil-pds-valkey
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: sunnyshore
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          args:
            - valkey-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tranquil-pds-valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: tranquil-pds-valkey
  namespace: tranquil-pds
  labels:
    app: tranquil-pds-valkey
spec:
  selector:
    app: tranquil-pds-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey

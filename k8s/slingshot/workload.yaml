apiVersion: v1
kind: Namespace
metadata:
  name: slingshot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slingshot
  namespace: slingshot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: slingshot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slingshot
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: canalave
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slingshot
          image: ghcr.io/alyraffauf/slingshot:latest@sha256:9c08405caedbca833078e7478aa051a370a5d27654f7965bcf92d292ec067be3
          env:
            - name: SLINGSHOT_COLLECT_METRICS
              value: "true"
            - name: SLINGSHOT_BIND_METRICS
              value: "0.0.0.0:8765"
            - name: SLINGSHOT_CACHE_DIR
              value: /cache
            - name: SLINGSHOT_IDENTITY_CACHE_DISK_DB
              value: "1"
            - name: SLINGSHOT_IDENTITY_CACHE_MEMORY_MB
              value: "32"
            - name: SLINGSHOT_JETSTREAM
              value: wss://jetstream1.us-east.bsky.network/subscribe
            - name: SLINGSHOT_RECORD_CACHE_DISK_DB
              value: "1"
            - name: SLINGSHOT_RECORD_CACHE_MEMORY_MB
              value: "128"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8765
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
              ephemeral-storage: 3Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slingshot
  namespace: slingshot
spec:
  selector:
    app.kubernetes.io/name: slingshot
  ports:
    - name: http
      port: 80
      targetPort: http

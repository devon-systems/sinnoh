rule_files:
  - workload-rules.json
evaluation_interval: 30s
fuzzy_compare: true
tests:
  - interval: 30s
    input_series:
      - series: 'kube_pod_owner{job="kube-state-metrics",namespace="web",pod="web-a",owner_kind="ReplicaSet",owner_name="web-123",owner_is_controller="true"}'
        values: "1+0x10"
      - series: 'kube_pod_owner{job="kube-state-metrics",namespace="web",pod="web-b",owner_kind="ReplicaSet",owner_name="web-123",owner_is_controller="true"}'
        values: "1+0x10"
      - series: 'kube_replicaset_owner{job="kube-state-metrics",namespace="web",replicaset="web-123",owner_kind="Deployment",owner_name="web",owner_is_controller="true"}'
        values: "1+0x10"
      - series: 'kube_pod_info{job="kube-state-metrics",namespace="web",pod="web-a",node="sunnyshore",created_by_kind="ReplicaSet"}'
        values: "1+0x10"
      - series: 'kube_pod_info{job="kube-state-metrics",namespace="web",pod="web-b",node="canalave",created_by_kind="ReplicaSet"}'
        values: "1+0x10"
      - series: 'kube_pod_owner{job="kube-state-metrics",namespace="db",pod="pg-1",owner_kind="Cluster",owner_name="pg",owner_is_controller="true"}'
        values: "1+0x10"
      - series: 'kube_pod_info{job="kube-state-metrics",namespace="db",pod="pg-1",node="sunnyshore",created_by_kind="Cluster"}'
        values: "1+0x10"
      - series: 'kube_pod_info{job="kube-state-metrics",namespace="tools",pod="debug",node="canalave",created_by_kind=""}'
        values: "1+0x10"
      - series: 'container_cpu_usage_seconds_total{job="cadvisor",namespace="web",pod="web-a",node="sunnyshore",container="web",image="web"}'
        values: "0 30 60 0 30 60 90 120 150 180 210"
      - series: 'container_cpu_usage_seconds_total{job="cadvisor",namespace="web",pod="web-b",node="canalave",container="web",image="web"}'
        values: "0+30x10"
      - series: 'container_cpu_usage_seconds_total{job="cadvisor",namespace="web",pod="web-b",node="canalave",container="POD",image="pause"}'
        values: "0+3000x10"
      - series: 'kube_pod_container_info{job="kube-state-metrics",namespace="web",pod="web-a",container="web"}'
        values: "1+0x10"
      - series: 'kube_pod_container_info{job="kube-state-metrics",namespace="web",pod="web-b",container="web"}'
        values: "1+0x10"
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="web",pod="web-a",container="web",resource="cpu"}'
        values: "2+0x10"
    promql_expr_test:
      - expr: "count(sinnoh_pod_workload_info)"
        eval_time: 5m
        exp_samples:
          - labels: "{}"
            value: 4
      - expr: 'sum by (workload, workload_kind) (sinnoh_pod_workload_info{namespace="web"})'
        eval_time: 5m
        exp_samples:
          - labels: '{workload="web",workload_kind="Deployment"}'
            value: 2
      - expr: 'sinnoh_pod_workload_info{namespace="tools"}'
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="sinnoh_pod_workload_info",namespace="tools",pod="debug",node="canalave",workload="debug",workload_kind="Pod"}'
            value: 1
      - expr: 'sum(rate(container_cpu_usage_seconds_total{job="cadvisor",container!="",container!="POD",image!=""}[2m]))'
        eval_time: 2m30s
        exp_samples:
          - labels: "{}"
            value: 1.6666666666666665
      - expr: 'sum by(pod) (kube_pod_container_resource_limits{resource="cpu"} or on(namespace,pod,container) (0 * kube_pod_container_info - 1))'
        eval_time: 5m
        exp_samples:
          - labels: '{pod="web-a"}'
            value: 2
          - labels: '{pod="web-b"}'
            value: -1
      - expr: 'kube_pod_container_resource_limits{namespace="absent"} or on(namespace,pod,container) (0 * kube_pod_container_info{namespace="absent"} - 1)'
        eval_time: 5m
        exp_samples: []
  - name: Slingshot latency aggregation and refresh failures
    interval: 30s
    input_series:
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-a",service="slingshot-slingshot-http@kubernetes",code="200",le="0.1"}'
        values: "0+15x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-a",service="slingshot-slingshot-http@kubernetes",code="200",le="0.25"}'
        values: "0+30x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-a",service="slingshot-slingshot-http@kubernetes",code="200",le="0.5"}'
        values: "0+30x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-a",service="slingshot-slingshot-http@kubernetes",code="200",le="+Inf"}'
        values: "0+30x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-b",service="slingshot-slingshot-http@kubernetes",code="200",le="0.1"}'
        values: "0+45x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-b",service="slingshot-slingshot-http@kubernetes",code="200",le="0.25"}'
        values: "0+120x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-b",service="slingshot-slingshot-http@kubernetes",code="200",le="0.5"}'
        values: "0+270x6"
      - series: 'traefik_service_request_duration_seconds_bucket{job="traefik",instance="proxy-b",service="slingshot-slingshot-http@kubernetes",code="200",le="+Inf"}'
        values: "0+300x6"
      # Unequal fetch volumes and a reset distinguish weighted counter rates
      # from averaging per-pod latency or using raw cumulative sums.
      - series: 'slingshot_fetch_record_sum{job="slingshot",instance="app-a",success="true"}'
        values: "0 30 60 0 30 60 90"
      - series: 'slingshot_fetch_record_count{job="slingshot",instance="app-a",success="true"}'
        values: "0 30 60 0 30 60 90"
      - series: 'slingshot_fetch_record_sum{job="slingshot",instance="app-b",success="true"}'
        values: "0+270x6"
      - series: 'slingshot_fetch_record_count{job="slingshot",instance="app-b",success="true"}'
        values: "0+300x6"
      - series: 'identity_did_refresh{job="slingshot",success="false",reason="bad doc"}'
        values: "0+3000x6"
      - series: 'identity_did_refresh{job="slingshot",success="false",reason="wrong did"}'
        values: "0+30x6"
      - series: 'identity_did_refresh{job="slingshot",success="true"}'
        values: "0+0x6"
      # Router counters include failures before a backend request is possible.
      - series: 'traefik_router_requests_total{job="traefik",router="websecure-slingshot-slingshot-slingshot-aly-town@kubernetes",code="503"}'
        values: "0+30x6"
      - series: 'traefik_router_requests_total{job="traefik",router="websecure-slingshot-slingshot-slingshot-aly-town@kubernetes",code="400"}'
        values: "0+60x6"
      - series: 'traefik_router_requests_total{job="traefik",router="websecure-skytrace-skytrace-skytrace-aly-town@kubernetes",code="503"}'
        values: "0+3000x6"
    promql_expr_test:
      - expr: 'histogram_quantile(0.5, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{job="traefik",service="slingshot-slingshot-http@kubernetes",code="200"}[2m])))'
        eval_time: 2m30s
        exp_samples:
          - labels: "{}"
            value: 0.275
      - expr: 'sum(rate(slingshot_fetch_record_sum{job="slingshot",success="true"}[2m])) / sum(rate(slingshot_fetch_record_count{job="slingshot",success="true"}[2m]))'
        eval_time: 2m30s
        exp_samples:
          - labels: "{}"
            value: 0.90625
      - expr: 'histogram_quantile(0.5, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{job="absent"}[2m])))'
        eval_time: 2m30s
        exp_samples: []
      - expr: 'sum(rate(slingshot_fetch_record_sum{job="absent",success="true"}[2m])) / sum(rate(slingshot_fetch_record_count{job="absent",success="true"}[2m]))'
        eval_time: 2m30s
        exp_samples: []
      - expr: 'sum by (success, reason) (rate(identity_did_refresh{job="slingshot"}[2m]))'
        eval_time: 2m30s
        exp_samples:
          - labels: '{success="false",reason="bad doc"}'
            value: 100
          - labels: '{success="false",reason="wrong did"}'
            value: 1
          - labels: '{success="true"}'
            value: 0
      - expr: 'sum by (code) (rate(traefik_router_requests_total{job="traefik",router=~"(web-|websecure-)?slingshot-slingshot-slingshot-aly-town@kubernetes",code=~"[45].."}[2m]))'
        eval_time: 2m30s
        exp_samples:
          - labels: '{code="400"}'
            value: 2
          - labels: '{code="503"}'
            value: 1
